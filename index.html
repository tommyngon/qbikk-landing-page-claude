<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>QBIKK — Your AI secretary</title>
<meta name="description" content="QBIKK. Your pocket-sized perfect memory." />
<link rel="icon" href="assets/qbikk-icon.png" />
<link rel="apple-touch-icon" href="assets/qbikk-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
<script>
  (function () {
    var t;
    try { t = localStorage.getItem('qbikk-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    /* Supernova palette */
    --nova-blue:   #2A6BFF;
    --nova-teal:   #1FC7DB;
    --nova-green:  #4CDB85;
    --nova-orange: #FF8F38;

    --sans:  "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --mono:  "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease:  cubic-bezier(.2, .8, .2, 1);
    --lvl: 0;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:    #FAFAFB;
    --ink:   #0B0C10;
    --ink-2: #5E6270;
    --ink-3: #A2A6B3;
    --hair:  rgba(11, 12, 16, .07);

    --glass:        rgba(244, 246, 250, .58);
    --glass-rim:    rgba(255, 255, 255, .9);
    --glass-edge:   rgba(11, 12, 16, .09);
    --glass-hi:     rgba(255, 255, 255, 1);
    --glass-shadow: 0 12px 32px -14px rgba(20, 40, 80, .22), 0 1px 2px rgba(11, 12, 16, .04);

    --solid:     #0B0C10;
    --solid-ink: #FFFFFF;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:    #06070A;
    --ink:   #F3F4F7;
    --ink-2: #9A9FAE;
    --ink-3: #5A5F6E;
    --hair:  rgba(255, 255, 255, .08);

    --glass:        rgba(255, 255, 255, .06);
    --glass-rim:    rgba(255, 255, 255, .13);
    --glass-edge:   rgba(0, 0, 0, .6);
    --glass-hi:     rgba(255, 255, 255, .2);
    --glass-shadow: 0 16px 40px -16px rgba(0, 0, 0, .9);

    --solid:     #F3F4F7;
    --solid-ink: #0B0C10;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; }

  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: .5px solid var(--glass-rim);
    box-shadow: inset 0 .5px 0 var(--glass-hi), 0 0 0 .5px var(--glass-edge), var(--glass-shadow);
  }

  /* ── Frame ───────────────────────────────────────── */
  .page {
    position: relative;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    justify-items: center;
  }
  #cube { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }

  header {
    position: relative; z-index: 3;
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px clamp(20px, 3.2vw, 44px);
  }
  .logo {
    display: block; height: 19px; aspect-ratio: 460 / 114;
    background: var(--ink);
    -webkit-mask: url(assets/qbikk-wordmark.png) center / contain no-repeat;
            mask: url(assets/qbikk-wordmark.png) center / contain no-repeat;
  }
  .actions { display: flex; align-items: center; gap: 8px; }
  .theme {
    position: relative; width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; color: var(--ink-2);
    transition: color .3s var(--ease);
  }
  .theme:hover { color: var(--ink); }
  .theme svg { position: absolute; width: 15px; height: 15px; transition: opacity .35s var(--ease), transform .5s var(--ease); }
  [data-theme="light"] .theme .moon, [data-theme="dark"] .theme .sun { opacity: 0; transform: rotate(-45deg) scale(.5); }
  .cta {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 14px 0 16px; border-radius: 999px;
    background: var(--solid); color: var(--solid-ink);
    font-size: 13.5px; font-weight: 500; letter-spacing: -.005em; text-decoration: none;
    transition: opacity .3s var(--ease);
  }
  .cta:hover { opacity: .86; }
  .cta svg { width: 13px; height: 13px; transition: transform .3s var(--ease); }
  .cta:hover svg { transform: translateX(2px); }
  :focus-visible { outline: 1.5px solid var(--nova-teal); outline-offset: 3px; }

  .intro { position: relative; z-index: 2; text-align: center; padding: clamp(0px, 1.5vh, 20px) 20px 0; }
  h1 {
    font-weight: 500;
    font-size: clamp(38px, 4.4vw, 64px);
    line-height: 1;
    letter-spacing: -.045em;
  }
  h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.1em; letter-spacing: -.015em; }
  .slogan {
    margin-top: 14px;
    font-size: clamp(15px, 1.2vw, 17px);
    letter-spacing: -.01em;
    color: var(--ink-2);
  }

  .stage { position: relative; width: 100%; }

  /* ── Dock: compact liquid-glass pill ─────────────── */
  .dock {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 0 16px max(28px, env(safe-area-inset-bottom));
  }
  .pill {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    width: min(380px, calc(100vw - 32px));
    height: 46px;
    padding: 0 6px 0 16px;
    border-radius: 999px;
  }
  .dot {
    flex: none; width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-3);
    transition: background .4s var(--ease), box-shadow .4s var(--ease);
  }
  [data-state="listening"]  .dot { background: var(--nova-green);  box-shadow: 0 0 8px var(--nova-green); animation: pulse 1.3s ease-in-out infinite; }
  [data-state="processing"] .dot { background: var(--nova-blue);   box-shadow: 0 0 8px var(--nova-blue); }
  [data-state="done"]       .dot { background: var(--nova-orange); box-shadow: 0 0 8px var(--nova-orange); }
  @keyframes pulse { 50% { opacity: .3; } }

  .text { position: relative; flex: 1; min-width: 0; overflow: hidden; height: 20px; }
  .text.overflow { -webkit-mask-image: linear-gradient(90deg, transparent, #000 28px); mask-image: linear-gradient(90deg, transparent, #000 28px); }
  .line {
    position: absolute; left: 0; top: 0;
    white-space: nowrap;
    font-size: 14px; line-height: 20px; letter-spacing: -.008em;
    transition: transform .28s var(--ease);
  }
  .line .ph { color: var(--ink-2); }
  .line .final { color: var(--ink); }
  .line .interim { color: var(--ink-3); }
  .line .done { color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .line .done svg { width: 12px; height: 12px; color: var(--nova-orange); }
  .time {
    flex: none; font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    font-variant-numeric: tabular-nums; min-width: 0;
  }

  .mic-wrap { position: relative; flex: none; width: 34px; height: 34px; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 210deg, var(--nova-blue), var(--nova-teal), var(--nova-green), var(--nova-orange), var(--nova-blue));
    filter: blur(7px); opacity: 0;
    transform: scale(calc(1.05 + var(--lvl) * .6));
    transition: opacity .4s var(--ease);
  }
  [data-state="listening"] .ring { opacity: .95; }
  .mic {
    position: relative; width: 34px; height: 34px; border-radius: 50%;
    background: var(--solid); color: var(--solid-ink);
    display: grid; place-items: center; cursor: pointer;
    transition: transform .25s var(--ease), background .4s var(--ease), color .4s var(--ease);
  }
  .mic:hover { transform: scale(1.06); }
  .mic:active { transform: scale(.94); }
  .mic svg { position: absolute; width: 15px; height: 15px; transition: opacity .25s var(--ease), transform .35s var(--ease); }
  .mic .i-stop { opacity: 0; transform: scale(.5); }
  [data-state="listening"] .mic { background: #FFFFFF; color: #0B0C10; }
  [data-state="listening"] .mic .i-mic { opacity: 0; transform: scale(.5); }
  [data-state="listening"] .mic .i-stop { opacity: 1; transform: none; }
  .mic-wrap::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%; pointer-events: none;
    border: 1px solid transparent; border-top-color: var(--nova-teal);
    opacity: 0; transition: opacity .3s var(--ease);
  }
  [data-state="processing"] .mic-wrap::after { opacity: 1; animation: spin .9s linear infinite; }
  [data-state="processing"] .mic { pointer-events: none; opacity: .5; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* recalled memory chips, floating above the pill */
  .memo {
    position: absolute; left: 50%; bottom: calc(100% + 10px);
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 13px; border-radius: 999px;
    font-size: 12.5px; letter-spacing: -.005em; white-space: nowrap;
    opacity: 0; transform: translateY(6px) scale(.98);
    transition: opacity .45s var(--ease), transform .55s var(--ease);
  }
  .chip.in { opacity: 1; transform: none; }
  .chip .k { color: var(--ink-3); }
  .chip .v { color: var(--ink); font-weight: 500; }

  .note { font-size: 11px; letter-spacing: .01em; color: var(--ink-3); }

  @media (max-width: 640px) {
    header { padding: 18px 16px; }
    .logo { height: 16px; }
    .cta .long { display: none; }
    .chip { font-size: 12px; }
  }
  @media (max-height: 620px) { body { overflow: auto; } .page { min-height: 620px; } }
  @media (prefers-reduced-motion: reduce) {
    [data-state="listening"] .dot { animation: none; }
  }
</style>
</head>
<body data-state="idle">
<div class="page">
  <canvas id="cube" aria-hidden="true"></canvas>

  <header>
    <a class="logo" href="#" role="img" aria-label="QBIKK"></a>
    <div class="actions">
      <button class="theme glass" id="theme" type="button" aria-label="Switch to dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
      <a class="cta" href="#waitlist"><span>Join<span class="long"> the waitlist</span></span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </a>
    </div>
  </header>

  <section class="intro">
    <h1>Your AI <em>secretary</em>.</h1>
    <p class="slogan">Your pocket-sized perfect memory.</p>
  </section>

  <section class="stage" id="stage" aria-hidden="true"></section>

  <section class="dock" aria-label="Preview">
    <div class="pill glass">
      <div class="memo" id="memo"></div>
      <i class="dot"></i>
      <div class="text" id="textbox" aria-live="polite">
        <div class="line" id="line"><span class="ph">Tap to preview QBIKK</span></div>

          <svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2.4" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <p class="note">Scripted preview · no audio is recorded</p>
  </section>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const root = document.documentElement;
  const body = document.body;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── Theme ─────────────────────────────────────────── */
  const BG = { light: [250, 250, 251], dark: [6, 7, 10] };   // = --bg
  const themeBtn = $('#theme');
  const applyTheme = (t) => {
    root.dataset.theme = t;
    themeBtn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  };
  applyTheme(root.dataset.theme);
  themeBtn.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('qbikk-theme', next); } catch (e) {}
  });

  /* ── Cube ──────────────────────────────────────────── */
  const canvas = $('#cube');
  const gl = canvas.getContext('webgl', { alpha: false, antialias: false });

  const vert = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
  const frag = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform mat3  uRot;
uniform vec3  uSquash;
uniform float uLevel;
uniform float uEnergy;
uniform float uProc;
uniform float uBloom;
uniform float uScale;
uniform vec3  uBg;
uniform float uDark;

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }

float sdRoundBox(vec3 p, vec3 b, float r){
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r;
}

vec3 warp(vec3 p){
  float t = uTime;
  float a = 0.062 + 0.12*uLevel*uEnergy + 0.02*uEnergy;
  p += a*vec3(
    sin(p.y*2.1 + t*0.90 + sin(p.z*1.3 + t*0.50)),
    sin(p.z*1.9 + t*1.10 + 1.7 + sin(p.x*1.7 - t*0.40)),
    sin(p.x*2.3 + t*0.80 + 3.1 + sin(p.y*1.5 + t*0.60)));
  p += a*0.38*vec3(sin(p.z*5.3 - t*2.1), sin(p.x*4.9 + t*1.7), sin(p.y*5.7 - t*1.9));
  return p;
}

// supernova ramp: cold blue shell → teal → green → orange heart → hot amber
vec3 nova(float s){
  vec3 c0 = vec3(0.165, 0.420, 1.000); // #2A6BFF
  vec3 c1 = vec3(0.122, 0.780, 0.859); // #1FC7DB
  vec3 c2 = vec3(0.298, 0.859, 0.522); // #4CDB85
  vec3 c3 = vec3(1.000, 0.561, 0.220); // #FF8F38
  vec3 c4 = vec3(1.000, 0.820, 0.520); // #FFD185
  s = clamp(s, 0.0, 1.0);
  if (s < 0.28) return mix(c0, c1, s/0.28);
  if (s < 0.55) return mix(c1, c2, (s - 0.28)/0.27);
  if (s < 0.82) return mix(c2, c3, (s - 0.55)/0.27);
  return mix(c3, c4, (s - 0.82)/0.18);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  vec3 ro = vec3(0.0, 0.0, 3.6);
  vec3 rd = normalize(vec3(uv, -0.92));

  float R = 2.2;
  float b = dot(ro, rd);
  float h = b*b - (dot(ro, ro) - R*R);

  vec3  acc = vec3(0.0);
  float A = 0.0;
  vec3  lightDir = normalize(vec3(-0.65, 0.7, 0.55));
  float grainT = floor(uTime*18.0);

  if (h > 0.0) {
    h = sqrt(h);
    float t0 = -b - h, t1 = -b + h;
    const int N = 80;
    float dt = 1.9/60.0;
    float t = t0 + dt*hash(gl_FragCoord.xy + grainT);
    float soft = 0.18 + 0.05*uEnergy;
    float sweep = mod(uTime*1.1, 3.2) - 1.6;

    for (int i = 0; i < N; i++) {
      vec3 p = ro + rd*t;
      vec3 q = warp((uRot*p) / (uScale*uSquash));
      float d = sdRoundBox(q, vec3(0.56), 0.22);

      float fill  = 1.0 - smoothstep(-0.4, soft, d);
      float shell = exp(-abs(d)*13.0) * (1.0 - smoothstep(-0.03, 0.12, d));
      float dens  = fill*0.5 + shell*1.3;

      if (dens > 0.002) {
        vec3 aq = abs(q) + 1e-4;
        vec3 w  = pow(aq / max(max(aq.x, aq.y), aq.z), vec3(9.0));
        w /= (w.x + w.y + w.z);
        vec3 nWorld = (sign(q)*w) * uRot;
        float lit = dot(normalize(nWorld + 1e-4), lightDir)*0.5 + 0.5;

        float depth = clamp(-d/0.52, 0.0, 1.0);
        float flow  = sin(dot(q, vec3(2.3, 1.7, -1.9)) + uTime*1.2 + 2.0*sin(q.y*2.5 - uTime*0.7));

        // per-face supernova tints (soft-blended at the creases), carried by the rotation
        vec3 sx = step(0.0, q);
        vec3 fx = mix(vec3(0.30, 0.86, 0.52), vec3(1.00, 0.56, 0.22), sx.x);  // -x green  | +x orange
        vec3 fy = mix(vec3(0.12, 0.78, 0.86), vec3(0.24, 0.47, 1.00), sx.y);  // -y teal   | +y blue
        vec3 fz = mix(vec3(0.20, 0.82, 0.66), vec3(0.23, 0.62, 1.00), sx.z);  // -z jade   | +z sky
        vec3 col = fx*w.x + fy*w.y + fz*w.z;
        // only faces turned toward the viewer carry colour; back faces stay neutral mist
        float facing = clamp(dot(normalize(nWorld + 1e-4), -rd)*1.7 + 0.3, 0.0, 1.0);
        vec3 mist = mix(vec3(0.84, 0.90, 0.95), vec3(0.30, 0.42, 0.52), uDark);
        col = mix(mist, col, facing);
        // interior currents: colour drifts slowly through the gel
        col = mix(col, nova(0.3 + 0.25*flow), 0.18 + 0.2*depth);
        col = mix(col, vec3(1.0, 0.6, 0.25), 0.18*uLevel*uEnergy);
        // frosted planes: lit faces mist toward white, cube still reads
        col = mix(col, vec3(0.95, 0.97, 1.0), lit*lit*mix(0.26, 0.14, uDark)*(1.0 - depth*0.7));

        // filaments drifting inside the gel
        float vein = pow(1.0 - abs(sin(q.x*3.1 + 1.6*sin(q.y*2.4 + uTime*0.9) + q.z*1.3 + uTime*0.6)), 12.0);
        vec3 warm = vec3(1.0, 0.56, 0.22);
        col = mix(col, warm, vein*fill*(0.5 + 0.25*uEnergy));

        float m1 = max(max(w.x, w.y), w.z);
        col += smoothstep(0.66, 0.5, m1)*shell*vec3(0.10, 0.12, 0.14);

        col += uProc*exp(-pow((q.y - sweep)*5.0, 2.0))*vec3(0.12, 0.2, 0.28);
        col += uBloom*vec3(0.12, 0.08, 0.04);

        float k = 2.1*(0.85 + 0.5*uEnergy + 0.25*uBloom)*mix(1.0, 0.86, uDark);
        float a = 1.0 - exp(-dens*dt*k);
        acc += (1.0 - A)*a*col;
        A   += (1.0 - A)*a;

        // emissive heart — the supernova core glows through the shell
        float core = exp(-dot(q, q)*7.0);
        acc += (1.0 - 0.6*A)*core*vec3(1.0, 0.52, 0.18)*dt*(0.38 + 0.8*uLevel*uEnergy + 0.45*uBloom)*mix(0.75, 1.25, uDark);

        if (A > 0.97) break;
      }
      t += max(dt, (d - 0.32)*0.7);
      if (t > t1) break;
    }
  }

  float r2 = dot(uv, uv) / (0.34*0.34*uScale*uScale);
  float haloAmt = exp(-r2*1.6)*(0.14 + 0.2*uEnergy + 0.28*uLevel*uEnergy + 0.12*uBloom)*(1.0 - A)*mix(1.0, 1.8, uDark);
  haloAmt *= 1.0 - smoothstep(0.3, 0.5, length(uv));
  vec3 haloCol = nova(0.1 + 0.4*clamp(0.5 - uv.x*0.9 - uv.y*0.5, 0.0, 1.0));
  acc += haloCol*haloAmt;
  A = min(A + haloAmt, 1.0);

  float n = hash(gl_FragCoord.xy*0.73 + grainT*17.0) - 0.5;
  acc += n*mix(0.07, 0.085, uDark)*A;

  vec3 outc = uBg*(1.0 - A) + acc;
  outc += (hash(gl_FragCoord.xy + 3.1) - 0.5)/255.0;
  gl_FragColor = vec4(clamp(outc, 0.0, 1.0), 1.0);
}`;

  let prog, U = {};
  function compile(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  try {
    if (!gl) throw new Error('no webgl');
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    ['uRes','uTime','uRot','uSquash','uLevel','uEnergy','uProc','uBloom','uScale','uBg','uDark']
      .forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));
  } catch (e) {
    console.warn('Cube unavailable:', e);
    canvas.style.display = 'none';
  }

  // canvas is centred on the stage; the cube spans ~52% of viewport height
  const stage = $('#stage');
  let cx = 0, cy = 0, size = 0;
  function resize() {
    const r = stage.getBoundingClientRect();
    const page = canvas.parentElement.getBoundingClientRect();
    size = Math.round(Math.min(r.height * 1.72, innerWidth * 1.22, 1400));
    cx = r.left - page.left + r.width / 2;
    cy = r.top - page.top + r.height / 2;
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    canvas.style.width = canvas.style.height = size + 'px';
    canvas.width = canvas.height = Math.round(size * dpr);
    if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', resize);
  document.fonts && document.fonts.ready.then(resize);
  resize();

  function rotation(yaw, pitch, roll) {
    const cy_ = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), cr = Math.cos(roll), sr = Math.sin(roll);
    const Ry = [[cy_,0,sy],[0,1,0],[-sy,0,cy_]];
    const Rx = [[1,0,0],[0,cp,-sp],[0,sp,cp]];
    const Rz = [[cr,-sr,0],[sr,cr,0],[0,0,1]];
    const mul = (A, B) => A.map((row) => [0,1,2].map((j) => row[0]*B[0][j] + row[1]*B[1][j] + row[2]*B[2][j]));
    const M = mul(Rz, mul(Rx, Ry));
    return new Float32Array([M[0][0],M[1][0],M[2][0], M[0][1],M[1][1],M[2][1], M[0][2],M[1][2],M[2][2]]);
  }

  const S = { level: 0, energy: 0, proc: 0, bloom: 0, dark: root.dataset.theme === 'dark' ? 1 : 0, yaw: 0.72 };
  const T = { energy: 0, proc: 0 };
  const voice = { env: 0, kick() { this.env = 0.6 + Math.random() * 0.4; } };
  const approach = (c, t, rate, dt) => c + (t - c) * (1 - Math.exp(-rate * dt));
  let state = 'idle';

  let last = performance.now(), clock = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    const motion = reduceMotion ? 0.35 : 1;
    clock += dt * motion;

    voice.env *= Math.exp(-dt * 3.2);
    const syll = 0.55 + 0.45 * Math.abs(Math.sin(clock * 17 + Math.sin(clock * 5)));
    const raw = state === 'listening' ? voice.env * syll : 0;
    S.level  = approach(S.level, raw, raw > S.level ? 16 : 6, dt);
    S.energy = approach(S.energy, T.energy, 3, dt);
    S.proc   = approach(S.proc, T.proc, 4, dt);
    S.bloom  = approach(S.bloom, 0, 1.4, dt);
    S.dark   = approach(S.dark, root.dataset.theme === 'dark' ? 1 : 0, 6, dt);
    body.style.setProperty('--lvl', S.level.toFixed(3));

    const speed = (0.34 + 0.35 * S.energy + 0.7 * S.level * S.energy + 0.25 * S.proc) * motion;
    S.yaw += dt * speed;
    const pitch = 0.5 + 0.17 * Math.sin(clock * 0.37) + 0.07 * Math.sin(clock * 0.83 + 1.3) + 0.06 * S.level * S.energy;
    const roll  = 0.13 * Math.sin(clock * 0.29) + 0.06 * Math.sin(clock * 0.71 + 2.0);
    const sq = [1 + 0.035 * Math.sin(clock * 1.13), 1 + 0.035 * Math.sin(clock * 1.13 + 2.1), 1 + 0.035 * Math.sin(clock * 1.13 + 4.2)];
    const scale = 1 + 0.025 * Math.sin(clock * 0.95) + 0.07 * S.level * S.energy - 0.05 * S.proc + 0.035 * S.bloom;

    const bobY = Math.sin(clock * 0.9) * 8 + Math.sin(clock * 0.37) * 4;
    const bobX = Math.sin(clock * 0.53) * 4;
    canvas.style.transform = `translate(${(cx - size / 2 + bobX).toFixed(1)}px, ${(cy - size / 2 + bobY).toFixed(1)}px)`;

    if (gl && prog) {
      const th = BG[root.dataset.theme] || BG.light;
      gl.uniform2f(U.uRes, canvas.width, canvas.height);
      gl.uniform1f(U.uTime, clock);
      gl.uniformMatrix3fv(U.uRot, false, rotation(S.yaw, pitch, roll));
      gl.uniform3f(U.uSquash, sq[0], sq[1], sq[2]);
      gl.uniform1f(U.uLevel, S.level);
      gl.uniform1f(U.uEnergy, S.energy);
      gl.uniform1f(U.uProc, S.proc);
      gl.uniform1f(U.uBloom, S.bloom);
      gl.uniform1f(U.uScale, scale);
      gl.uniform3f(U.uBg, th[0] / 255, th[1] / 255, th[2] / 255);
      gl.uniform1f(U.uDark, S.dark);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    tickTime();
    requestAnimationFrame(frame);
  }

  /* ── Scripted preview: capture → remember → recall ─── */
  const SCENES = [
    { text: 'Okay — so Maria sends the revised budget by Thursday, and we move the launch review to the 14th.',
      label: 'Remembered · 2 items',
      items: [['Maria', 'Revised budget, Thursday'], ['Launch review', 'Moved to the 14th']] },
    { text: 'Idea for onboarding: skip the tutorial, let people talk to it in the first ten seconds.',
      label: 'Saved to Ideas',
      items: [['Onboarding', 'Voice-first in 10 seconds']] },
    { text: 'One tablet with breakfast for ten days, and come back if the cough lasts past Friday.',
      label: 'Reminders set · 2',
      items: [['Daily', 'One tablet with breakfast'], ['Friday', 'Follow up if cough persists']] },
    { text: 'This is Jonas — he runs partnerships at Nordlys and knows the retail buyers in Oslo.',
      label: 'New contact',
      items: [['Jonas', 'Partnerships, Nordlys'], ['Knows', 'Retail buyers in Oslo']] },
    { text: 'What did Maria say she’d send us?',
      label: 'Recalled from your meeting',
      items: [['Maria', 'Revised budget, by Thursday']] },
  ];

  const mic = $('#mic'), line = $('#line'), textbox = $('#textbox'), timeEl = $('#time'), memo = $('#memo');
  let scene = 0, run = 0, skip = false, startedAt = 0;
  const sleep = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? ms * 0.6 : ms));

  function setState(next) {
    state = next;
    body.dataset.state = next;
    T.energy = next === 'listening' ? 1 : 0;
    T.proc = next === 'processing' ? 1 : 0;
    if (next === 'done') S.bloom = 1;
    const listening = next === 'listening';
    mic.setAttribute('aria-pressed', String(listening));
    mic.setAttribute('aria-label', listening ? 'Stop preview' : 'Play preview');
    if (!listening) timeEl.textContent = '';
  }

  function tickTime() {
    if (state !== 'listening') return;
    const s = Math.floor((performance.now() - startedAt) / 1000);
    const txt = '0:' + String(s).padStart(2, '0');
    if (timeEl.textContent !== txt) timeEl.textContent = txt;
  }

  // keep the newest words in view, fading the start of the line
  function fit() {
    const over = line.scrollWidth - textbox.clientWidth;
    line.style.transform = `translateX(${over > 0 ? -over : 0}px)`;
    textbox.classList.toggle('overflow', over > 0);
  }

  function renderWords(words, committed) {
    line.textContent = '';
    const f = document.createElement('span'); f.className = 'final';
    f.textContent = words.slice(0, committed).join(' ');
    const i = document.createElement('span'); i.className = 'interim';
    const rest = words.slice(committed).join(' ');
    i.textContent = rest ? (f.textContent ? ' ' : '') + rest : '';
    line.append(f, i);
    fit();
  }

  function showDone(label) {
    line.innerHTML = '<span class="done"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 5 8.5l4.5-5"/></svg></span>';
    line.firstChild.append(label);
    line.style.transition = 'none';
    fit();
    requestAnimationFrame(() => (line.style.transition = ''));
  }

  async function play() {
    const my = ++run;
    skip = false;
    const sc = SCENES[scene++ % SCENES.length];

    memo.textContent = '';
    renderWords([], 0);
    startedAt = performance.now();
    setState('listening');
    await sleep(420);

    const words = sc.text.split(' ');
    let committed = 0;
    for (let i = 0; i < words.length; i++) {
      if (my !== run) return;
      if (skip) break;
      voice.kick();
      committed = Math.max(committed, i + 1 - 2 - Math.floor(Math.random() * 2));
      renderWords(words.slice(0, i + 1), committed);
      const w = words[i];
      let d = 90 + w.length * 34 + Math.random() * 70;
      if (/[,:;—]$/.test(w) || w === '—') d += 280;
      await sleep(d);
    }
    if (my !== run) return;
    renderWords(words, Math.max(0, words.length - 2));
    await sleep(skip ? 80 : 320);
    if (my !== run) return;

    setState('processing');
    renderWords(words, words.length);
    await sleep(1100);
    if (my !== run) return;

    showDone(sc.label);
    sc.items.forEach(([k, v]) => {
      const c = document.createElement('div');
      c.className = 'chip glass';
      const a = document.createElement('span'); a.className = 'k'; a.textContent = k;
      const b = document.createElement('span'); b.className = 'v'; b.textContent = v;
      c.append(a, b);
      memo.append(c);
    });
    setState('done');
    [...memo.children].forEach((c, n) => setTimeout(() => c.classList.add('in'), 120 + n * 130));
  }

  function toggle() {
    if (state === 'listening') skip = true;
    else if (state !== 'processing') play();
  }
  mic.addEventListener('click', toggle);
  addEventListener('keydown', (e) => {
    if (e.target.closest('button, a, input')) return;
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); toggle(); }
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
